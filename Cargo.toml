[workspace]
resolver = "2"
members = [
    "crates/sim-packets",
    "crates/sim-core",
    "crates/cli-engine",
    "crates/cli-dialects",
    "crates/lab-checks",
    "crates/sim-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

sim-packets = { path = "crates/sim-packets" }
sim-core = { path = "crates/sim-core" }
cli-engine = { path = "crates/cli-engine" }
cli-dialects = { path = "crates/cli-dialects" }
lab-checks = { path = "crates/lab-checks" }
