name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-pack 随仓库分发（v0.15.1 linux musl 静态二进制）：GitHub release CDN 偶发 504 时不再阻塞
      - name: 安装 wasm-pack（仓库内置二进制）
        run: |
          cp .github/bin/wasm-pack-linux-x64 /usr/local/bin/wasm-pack
          chmod +x /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: 构建 WASM 引擎
        run: wasm-pack build crates/sim-wasm --target web --out-name net_sim --out-dir ../../web/src/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
