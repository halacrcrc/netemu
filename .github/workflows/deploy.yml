name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-pack 二进制缓存：release CDN 偶发 504，命中缓存即跳过下载
      - name: 缓存 wasm-pack
        id: wpcache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/wasm-pack
          key: wasm-pack-v0.15.1-linux-x64

      - name: 安装 wasm-pack（缓存未命中时）
        if: steps.wpcache.outputs.cache-hit != 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.1

      - name: 构建 WASM 引擎
        run: wasm-pack build crates/sim-wasm --target web --out-name net_sim --out-dir ../../web/src/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
