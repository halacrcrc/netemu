name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元与场景测试
        run: cargo test --workspace

      # wasm-pack 随仓库分发（v0.15.1 linux musl 静态二进制）：GitHub release CDN 偶发 504 时不再阻塞
      - name: 安装 wasm-pack（仓库内置二进制）
        run: |
          cp .github/bin/wasm-pack-linux-x64 /usr/local/bin/wasm-pack
          chmod +x /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: 构建 WASM
        run: wasm-pack build crates/sim-wasm --target web --out-name net_sim --out-dir ../../web/src/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端构建
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build
